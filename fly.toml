app = "group-workflow-management"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TZ = "Asia/Seoul"
  DEFAULT_TIMEZONE = "Asia/Seoul"
  SMTP_FROM = "조직 일정 관리 <no-reply@g-wf-m.com>"
  APP_URL = "https://group-workflow-management.fly.dev"
  BETTER_AUTH_URL = "https://group-workflow-management.fly.dev"
  PRIVACY_CONTROLLER_NAME = "조직 일정 관리 운영자"
  PRIVACY_DB_COUNTRY = "싱가포르"
  PRIVACY_DB_PROVIDER = "Aiven Ltd"
  PRIVACY_DB_CONTACT = "dpo@aiven.io"
  PRIVACY_DB_INFRA_PROVIDER = "DigitalOcean LLC"
  PRIVACY_CONTACT_EMAIL = "ydyd9875@gmail.com"

[deploy]
  release_command = "./node_modules/.bin/prisma migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
